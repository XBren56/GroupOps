<style>

ze:9px}.source-note{font-size:9px;color:#8a969c;margin-top:9px}
@media(max-width:1000px){.app{grid-template-columns:210px minmax(0,1fr)}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.quick-row{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:8;left:-270px;top:0;width:246px;transition:left .2s;box-shadow:20px 0 45px #142b3730}.sidebar.open{left:0}.menu-btn{display:grid}.topbar{height:58px;padding:0 14px}.search input{width:140px}.content{padding:22px 14px 42px}.page-head{flex-direction:column}.page-head h1{font-size:24px}.stats{gap:9px}.stat{padding:14px;min-height:96px}.stat-val{font-size:23px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%;flex-wrap:wrap}.filter-search{flex:1;min-width:150px}.report-grid{grid-template-columns:1fr}.quick-row{gap:8px}.top-actions{gap:6px}.actions{width:100%;flex-wrap:wrap}.modal-body{grid-template-columns:1fr}.field.full{grid-column:auto}.calendar{gap:2px}.cal-day{height:64px;padding:4px}.cal-head{font-size:8px;padding:4px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">GO</div><div><div class="brand-name">GroupOps</div><div class="brand-sub">Your group, in sync</div></div></div>
  <div class="org-card"><div class="org-icon">KK</div><div class="org-copy"><div class="org-title">Kidi Kidish</div><div class="org-type">Lodge / chapter</div></div><span class="chev">⌄</span></div>
  <div class="nav-label">Workspace</div><nav class="nav" id="mainNav"></nav>
  <div class="nav-spacer"></div><div class="nav-label">Manage</div><nav class="nav" id="manageNav"></nav>
  <div class="side-foot">A calmer way to plan together.<div class="profile"><div class="avatar">KB</div><div><b>Workspace owner</b><small>Kidi Kidish</small></div></div></div>
</aside>
<main class="main">
  <header class="topbar"><div style="display:flex;align-items:center;gap:11px"><button class="icon-btn menu-btn" id="menuToggle" aria-label="Open menu">☰</button><div class="crumb">Kidi Kidish&nbsp; / &nbsp;<b id="crumb">Overview</b></div></div><div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search workspace…" aria-label="Search workspace"></label><button class="icon-btn" id="importTop" title="Import GroupOps export">⇧</button><button class="icon-btn" id="exportTop" title="Export workspace">⇩</button></div></header>
  <section class="content" id="content"></section>
</main>
</div>
<input type="file" class="file-input" id="filePicker" accept=".json,application/json">
<div id="overlay"></div><div id="toastArea"></div>
<script>
const navMain=[['overview','⌂','Overview'],['projects','▦','Projects'],['schedule','▦','Schedule'],['tasks','✓','Tasks'],['shopping','🛒','Shopping'],['food','◒','Menus & food'],['budget','＄','Budget'],['inventory','◈','Inventory'],['people','♙','People'],['meetings','▤','Meetings']];
const navManage=[['publications','▧','News & publications'],['social','◎','Media planner'],['documents','▣','Files & documents'],['reports','▥','Reports'],['templates','◇','Templates'],['whiteboard','✎','Whiteboard'],['qa','?','Q&A'],['settings','⚙','Settings']];
const moduleMap={projects:['projects'],schedule:['schedule','events','meetings'],tasks:['tasks','training','challenges','ihub'],shopping:['shopping'],food:['food'],budget:['budget'],inventory:['inventory'],people:['people'],meetings:['meetings'],publications:['publications'],social:['social'],documents:['documents'],templates:['templates'],whiteboard:['whiteboard'],qa:['qa','questions']};
const titles={overview:'Overview',projects:'Projects',schedule:'Schedule',tasks:'Tasks',shopping:'Shopping',food:'Menus & food',budget:'Budget',inventory:'Inventory',people:'People',meetings:'Meetings',publications:'News & publications',social:'Media planner',documents:'Files & documents',reports:'Reports',templates:'Templates',whiteboard:'Whiteboard',qa:'Q&A',settings:'Settings'};
const descriptions={overview:'A clear view of what your group is working on.',projects:'Plan initiatives, track owners, and keep the next steps visible.',schedule:'See important dates and what is coming up for your group.',tasks:'Keep the little things moving and the big things on track.',shopping:'Track supplies, quantities, links, and estimated costs.',food:'Plan menus and food needs for upcoming events.',budget:'Keep project costs and estimated spending together.',inventory:'Know what your group has and what needs restocking.',people:'Keep track of people to contact and who is helping.',meetings:'Prepare agendas, notes, and follow-ups in one place.',publications:'Organize newsletters, articles, and group updates.',social:'Plan posts and keep campaign ideas together.',documents:'Keep useful links and file references easy to find.',reports:'Get a quick read on progress and workload.',templates:'Reuse surveys, event plans, and other helpful starting points.',whiteboard:'Capture ideas and make the next plan together.',qa:'Collect questions and follow up with clear answers.',settings:'Manage your workspace and its data.'};
let current='overview', query='', store=loadStore();
function loadStore(){try{return JSON.parse(localStorage.getItem('groupops-workspace-v1'))||{organization:{name:'Kidi Kidish'},items:[]}}catch{return{organization:{name:'Kidi Kidish'},items:[]}}}
function saveStore(){localStorage.setItem('groupops-workspace-v1',JSON.stringify(store))}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function nav(){document.getElementById('mainNav').innerHTML=navMain.map(n=>navButton(n)).join('');document.getElementById('manageNav').innerHTML=navManage.map(n=>navButton(n,true)).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function navButton(n,manage=false){let count=n[0]==='overview'?null:(n[0]==='reports'||n[0]==='settings'?null:itemsFor(n[0]).length);return `<button data-page="${n[0]}" class="${current===n[0]?'active':''}"><span class="nav-ico">${n[1]}</span>${n[2]}${count?`<span class="module-count">${count}</span>`:''}</button>`}
function go(page){current=page;document.getElementById('crumb').textContent=titles[page]||page;document.getElementById('sidebar').classList.remove('open');render()}
function itemsFor(page){const mods=moduleMap[page]||[page];return (store.items||[]).filter(x=>mods.includes(x.module))}
function statusClass(s=''){let v=s.toLowerCase();if(/done|complete|published|approved|ready|paid/.test(v))return'pill';if(/buy|needed|overdue|blocked|idea|draft|todo/.test(v))return'pill orange';if(/scheduled|in progress|planning|assigned/.test(v))return'pill blue';return'pill gray'}
function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0)}
function filtered(list){let q=query.trim().toLowerCase();return q?list.filter(x=>[x.title,x.notes,x.owner,x.status,x.externalLabel].some(v=>String(v||'').toLowerCase().includes(q))):list}
function render(){nav();const c=document.getElementById('content');if(current==='overview')c.innerHTML=dashboard();else if(current==='reports')c.innerHTML=reports();else if(current==='settings')c.innerHTML=settings();else if(current==='schedule')c.innerHTML=schedulePage();else if(current==='whiteboard')c.innerHTML=whiteboard();else c.innerHTML=listPage(current);bindContent()}
function dashboard(){const open=(store.items||[]).filter(x=>!/(done|complete|published)/i.test(x.status||'')).length, projects=itemsFor('projects'), shopping=itemsFor('shopping'), next=itemsFor('schedule').slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);const uniqueProjects=[...new Map(projects.map(x=>[x.title,x])).values()];return `<div class="page-head"><div><div class="eyebrow">Kidi Kidish workspace</div><h1>Good evening 👋</h1><p>Here’s what’s moving across your group today.</p></div><div class="actions"><button class="btn" data-action="import">⇧ Import data</button><button class="btn primary" data-action="new">＋ Add item</button></div></div>
<div class="grid stats"><div class="card stat"><div class="stat-top"><span class="stat-name">Open items</span><span class="stat-icon">✓</span></div><div class="stat-val">${open}</div><div class="stat-note">Across all workspace areas</div></div><div class="card stat"><div class="stat-top"><span class="stat-name">Active projects</span><span class="stat-icon">▦</span></div><div class="stat-val">${uniqueProjects.length}</div><div class="stat-note">Initiatives in the workspace</div></div><div class="card stat"><div class="stat-top"><span class="stat-name">People to follow up</span><span class="stat-icon">♙</span></div><div class="stat-val">${itemsFor('people').length}</div><div class="stat-note">Contacts and helper reminders</div></div><div class="card stat"><div class="stat-top"><span class="stat-name">Shopping list</span><span class="stat-icon">🛒</span></div><div class="stat-val">${shopping.length}</div><div class="stat-note">Items currently tracked</div></div></div>
<div class="grid dash-grid"><div class="card panel"><div class="panel-head"><div><div class="panel-title">Projects in motion</div><div class="panel-sub">Your key initiatives and their latest items</div></div><button class="text-link" data-page-link="projects">View projects →</button></div>${uniqueProjects.length?`<div class="project-list">${uniqueProjects.slice(0,5).map((p,i)=>{let title=p.title||'Untitled project',related=(store.items||[]).filter(x=>x.projectId&&p.projectId===x.projectId),done=related.filter(x=>/done|complete|published/i.test(x.status||'')).length,pct=related.length?Math.round(done/related.length*100):0;return `<div class="project"><div class="project-mark">${esc(title.slice(0,2).toUpperCase())}</div><div class="project-info"><div class="project-name">${esc(title)}</div><div class="project-meta">${related.length} linked items · ${related.filter(x=>!/(done|complete)/i.test(x.status||'')).length} still open</div></div><div class="progress"><i style="width:${pct}%"></i></div><span class="pill ${i%2?'blue':'gray'}">${pct}%</span></div>`}).join('')}</div>`:`<div class="empty"><div class="empty-icon">▦</div><b>Start with a project</b><p>Import your GroupOps export to bring projects and planning items into this workspace.</p><button class="btn small" data-action="import">Import export</button></div>`}</div>
<div class="card panel"><div class="panel-head"><div><div class="panel-title">Coming up</div><div class="panel-sub">Dates and meeting reminders</div></div><button class="text-link" data-page-link="schedule">Calendar →</button></div>${next.length?`<div class="timeline">${next.map(x=>`<div class="timeline-item"><div class="timeline-date">${esc(x.date||'TBD')}</div><div class="timeline-track"><i class="dot"></i></div><div class="timeline-copy"><b>${esc(x.title||'Untitled')}</b><small>${esc(x.time||x.module||'Scheduled')}</small></div></div>`).join('')}</div>`:`<div class="empty" style="padding:28px 8px"><div class="empty-icon">▦</div><b>Your calendar is clear</b><p>Add dates to events and meetings to see them here.</p></div>`}</div></div>
<div class="quick-row"><button class="quick" data-page-link="tasks"><i>✓</i><b>Track a task</b><small>Make the next step clear</small></button><button class="quick" data-page-link="shopping"><i>🛒</i><b>Add to shopping</b><small>Keep supplies organized</small></button><button class="quick" data-page-link="social"><i>◎</i><b>Plan a post</b><small>Keep your updates moving</small></button><button class="quick" data-action="import"><i>⇧</i><b>Import workspace</b><small>Bring in your JSON export</small></button></div><div class="notice"><span>ⓘ</span><div><b>This browser is your current workspace.</b> Imported data is saved on this device only. Shared sign-in and cloud storage are not connected yet.</div></div>`}
function listPage(page){let rows=filtered(itemsFor(page));return `<div class="page-head"><div><div class="eyebrow">Kidi Kidish</div><h1>${esc(titles[page]||page)}</h1><p>${esc(descriptions[page]||'Organize the details your group needs.')}</p></div><div class="actions"><button class="btn" data-action="import">⇧ Import export</button><button class="btn primary" data-action="new">＋ Add ${singular(page)}</button></div></div><div class="card section-card"><div class="toolbar"><div class="panel-title">${esc(titles[page]||page)} <span style="color:#8a969c;font-weight:500">· ${rows.length}</span></div><div class="filters"><input class="filter-search" id="localSearch" value="${esc(query)}" placeholder="Search ${esc((titles[page]||page).toLowerCase())}…"><select class="select" id="statusFilter"><option value="">All statuses</option>${[...new Set(itemsFor(page).map(x=>x.status).filter(Boolean))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>Status</th><th>Owner</th><th>Date / cost</th><th></th></tr></thead><tbody id="rows">${rows.map(itemRow).join('')}</tbody></table></div>`:`<div class="empty"><div class="empty-icon">${page==='shopping'?'🛒':'◇'}</div><b>${query?'No matching items':`Nothing in ${esc((titles[page]||page).toLowerCase())} yet`}</b><p>${query?'Try another search or clear the filter.':'Import your GroupOps JSON export or add the first item to start organizing this area.'}</p><button class="btn small primary" data-action="${store.items.length?'new':'import'}">${store.items.length?'＋ Add item':'⇧ Import export'}</button></div>`}</div><div class="source-note">${store.items.length?`Showing ${rows.length} of ${itemsFor(page).length} imported or added items.`:'Your export stays on this device. No account data is sent from this page.'}</div>`}
function itemRow(x){return `<tr><td><div class="item-title">${esc(x.title||'Untitled item')}</div>${x.notes?`<div class="item-note">${esc(x.notes)}</div>`:''}</td><td><span class="${statusClass(x.status)}">${esc(x.status||'Open')}</span></td><td><div class="owner"><span class="tiny-avatar">${esc((x.owner||'—').slice(0,1).toUpperCase())}</span>${esc(x.owner||'Unassigned')}</div></td><td>${x.date?esc(x.date):x.amount?fmt(x.amount):'—'}</td><td><div class="row-actions"><button class="row-action" title="Edit" data-edit="${esc(x.id)}">✎</button><button class="row-action" title="Delete" data-delete="${esc(x.id)}">×</button></div></td></tr>`}
function singular(page){return({shopping:'item',people:'contact',food:'menu item',publications:'publication',social:'post',documents:'file',meetings:'meeting',projects:'project',templates:'template'})[page]||'item'}
function reports(){let all=store.items||[], modules=[...new Set(all.map(x=>x.module))], open=all.filter(x=>!/(done|complete|published)/i.test(x.status||'')).length, spend=all.filter(x=>x.module==='shopping').reduce((s,x)=>s+(Number(x.amount)||0)*(Number(x.quantity)||1),0);return `<div class="page-head"><div><div class="eyebrow">Workspace insights</div><h1>Reports</h1><p>A quick snapshot of your group's planning activity.</p></div><div class="actions"><button class="btn" data-action="export">⇩ Export data</button></div></div><div class="grid report-grid"><div class="card report-tile"><h3>Tracked items</h3><p>Across all workspace areas</p><div class="report-num">${all.length}</div></div><div class="card report-tile"><h3>Open items</h3><p>Tasks, reminders, and plans to move forward</p><div class="report-num">${open}</div></div><div class="card report-tile"><h3>Shopping estimate</h3><p>Based on quantities and saved unit amounts</p><div class="report-num">${fmt(spend)}</div></div></div><div class="card panel" style="margin-top:15px"><div class="panel-head"><div><div class="panel-title">Items by area</div><div class="panel-sub">How your workspace is organized</div></div></div>${modules.length?`<div class="bar-list">${modules.map(m=>{let n=all.filter(x=>x.module===m).length,pct=Math.max(5,Math.round(n/Math.max(...modules.map(mm=>all.filter(x=>x.module===mm).length))*100));return `<div class="bar-row"><span>${esc(titles[m]||m)}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${n}</b></div>`}).join('')}</div>`:`<div class="empty"><b>No report data yet</b><p>Import your export or add workspace items to see a summary.</p><button class="btn small" data-action="import">Import data</button></div>`}</div>`}
function schedulePage(){let events=itemsFor('schedule').slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));let today=new Date(),month=today.getMonth(),year=today.getFullYear(),first=new Date(year,month,1),days=new Date(year,month+1,0).getDate(),start=(first.getDay()+6)%7;return `<div class="page-head"><div><div class="eyebrow">Dates & deadlines</div><h1>Schedule</h1><p>${today.toLocaleDateString('en-US',{month:'long',year:'numeric'})} · Event dates and meeting reminders</p></div><div class="actions"><button class="btn primary" data-action="new">＋ Add date</button></div></div><div class="card panel"><div class="panel-head"><div class="panel-title">${today.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</div><span class="pill">${events.length} tracked</span></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${Array.from({length:start},()=>'<div class="cal-day muted"></div>').join('')}${Array.from({length:days},(_,i)=>{let d=i+1,date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ev=events.filter(x=>x.date===date);return `<div class="cal-day ${d===today.getDate()?'today':''}">${d}${ev.map(x=>`<div class="cal-event" title="${esc(x.title)}">${esc(x.title)}</div>`).join('')}</div>`}).join('')}</div></div><div class="card panel" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">Upcoming items</div><div class="panel-sub">Add a date to an item to place it on the calendar.</div></div></div>${events.length?`<div class="table-wrap"><table><thead><tr><th>Event</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${events.map(x=>`<tr><td class="item-title">${esc(x.title)}</td><td>${esc(x.date||'No date')}</td><td><span class="${statusClass(x.status)}">${esc(x.status||'Open')}</span></td><td><button class="row-action" data-edit="${esc(x.id)}">✎</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Your calendar is open</b><p>Import your group export or add a dated event to start.</p></div>`}</div>`}
function whiteboard(){let notes=itemsFor('whiteboard');return `<div class="page-head"><div><div class="eyebrow">Ideas together</div><h1>Whiteboard</h1><p>Collect ideas and keep a simple plan in view.</p></div><div class="actions"><button class="btn primary" data-action="new">＋ Add idea</button></div></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));align-items:start">${notes.length?notes.map((x,i)=>`<div class="card panel" style="background:${['#fff8ec','#eef6f3','#f5f1f8'][i%3]};min-height:160px"><div class="panel-head"><span class="pill gray">Idea ${i+1}</span><button class="row-action" data-edit="${esc(x.id)}">✎</button></div><div style="font-weight:730;font-size:13px">${esc(x.title)}</div><p style="font-size:10px;color:#66747c;line-height:1.55">${esc(x.notes||'Add a note to develop this idea.')}</p></div>`).join(''):`<div class="card empty" style="grid-column:1/-1"><div class="empty-icon">✎</div><b>Make space for ideas</b><p>Capture activities, event themes, and ideas to explore together.</p><button class="btn small primary" data-action="new">＋ Add an idea</button></div>`}</div>`}
function settings(){return `<div class="page-head"><div><div class="eyebrow">Workspace setup</div><h1>Settings</h1><p>Manage your local workspace data and organization details.</p></div></div><div class="card panel"><div class="panel-title">Organization</div><div class="field" style="max-width:420px;margin-top:15px"><label>Workspace name</label><input id="orgName" value="${esc(store.organization?.name||'Kidi Kidish')}"></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="saveOrg">Save name</button></div></div><div class="card panel" style="margin-top:14px"><div class="panel-title">Data tools</div><div class="panel-sub">Export or replace the records saved in this browser.</div><div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap"><button class="btn" data-action="import">⇧ Import GroupOps JSON</button><button class="btn" data-action="export">⇩ Download workspace JSON</button><button class="btn warm" data-action="clear">Clear this browser's workspace</button></div><div class="notice" style="margin-top:17px"><span>ⓘ</span><div>Your data is stored in this browser only. It does not sync between members or devices. Cloud sign-in and a shared database are not set up on this Wix site.</div></div></div>`}
function bindContent(){document.querySelectorAll('[data-page-link]').forEach(b=>b.onclick=()=>go(b.dataset.pageLink));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete));const ls=document.getElementById('localSearch');if(ls)ls.oninput=e=>{query=e.target.value;render()};const sf=document.getElementById('statusFilter');if(sf)sf.onchange=()=>{let q=document.getElementById('localSearch')?.value||'';let list=filtered(itemsFor(current)).filter(x=>!sf.value||x.status===sf.value);document.getElementById('rows').innerHTML=list.map(itemRow).join('')||`<tr><td colspan="5" style="padding:30px;text-align:center;color:#89959b">No items with that status.</td></tr>`;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete))};const saveOrg=document.getElementById('saveOrg');if(saveOrg)saveOrg.onclick=()=>{store.organization.name=document.getElementById('orgName').value.trim()||'Kidi Kidish';saveStore();toast('Workspace name saved');render()}}
function action(a){if(a==='new')openForm();if(a==='import')document.getElementById('filePicker').click();if(a==='export')exportData();if(a==='clear'){if(confirm('Clear all GroupOps data saved in this browser?')){store={organization:{name:'Kidi Kidish'},items:[]};saveStore();render();toast('Browser workspace cleared')}}}
function openForm(id){let x=id?(store.items||[]).find(i=>i.id===id):null;let page=current==='overview'||current==='reports'||current==='settings'?'tasks':current;let defaultMod=(moduleMap[page]||[page])[0];const modules=[...new Set([...Object.keys(moduleMap),...(store.items||[]).map(i=>i.module)])].filter(k=>!['reports','settings','overview','qa','whiteboard'].includes(k));document.getElementById('overlay').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h2>${x?'Edit item':'Add to workspace'}</h2><button class="close" id="closeModal">×</button></div><div class="modal-body"><div class="field full"><label>Title</label><input id="fTitle" value="${esc(x?.title||'')}" placeholder="What needs to happen?"></div><div class="field"><label>Area</label><select id="fModule">${modules.map(m=>`<option value="${esc(m)}" ${(x?.module||defaultMod)===m?'selected':''}>${esc(titles[m]||m)}</option>`).join('')}</select></div><div class="field"><label>Status</label><input id="fStatus" value="${esc(x?.status||'To do')}" placeholder="To do"></div><div class="field"><label>Owner</label><input id="fOwner" value="${esc(x?.owner||'')}" placeholder="Name"></div><div class="field"><label>Date</label><input type="date" id="fDate" value="${esc(x?.date||'')}"></div><div class="field"><label>Amount</label><input type="number" step="0.01" id="fAmount" value="${esc(x?.amount||'')}" placeholder="0.00"></div><div class="field"><label>Quantity</label><input type="number" id="fQuantity" value="${esc(x?.quantity||1)}" min="1"></div><div class="field full"><label>Notes or link</label><textarea id="fNotes" placeholder="Add useful details…">${esc(x?.notes||x?.externalUrl||'')}</textarea></div></div><div class="modal-foot"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveItem">${x?'Save changes':'Add item'}</button></div></div></div>`;document.getElementById('closeModal').onclick=closeForm;document.getElementById('cancelModal').onclick=closeForm;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')closeForm()};document.getElementById('saveItem').onclick=()=>{let title=document.getElementById('fTitle').value.trim();if(!title){document.getElementById('fTitle').focus();return}let value={...(x||{}),id:x?.id||uid(),title,module:document.getElementById('fModule').value,status:document.getElementById('fStatus').value.trim()||'To do',owner:document.getElementById('fOwner').value.trim(),date:document.getElementById('fDate').value,amount:Number(document.getElementById('fAmount').value)||0,quantity:Number(document.getElementById('fQuantity').value)||1,notes:document.getElementById('fNotes').value.trim()};if(x)store.items=store.items.map(i=>i.id===x.id?value:i);else store.items.push(value);saveStore();closeForm();render();toast(x?'Changes saved':'Item added')}}
function closeForm(){document.getElementById('overlay').innerHTML=''}function del(id){if(!confirm('Delete this item from the browser workspace?'))return;store.items=store.items.filter(x=>x.id!==id);saveStore();render();toast('Item deleted')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.items))throw Error('This file does not look like a GroupOps export.');let incoming=data.items.map(x=>({...x,id:x.id||uid()}));if(!confirm(`Import ${incoming.length} items from this export? This replaces items currently saved in this browser.`))return;store={...store,organization:{...data.organization,...store.organization,name:data.organization?.name||store.organization?.name||'Kidi Kidish'},items:incoming};saveStore();render();toast(`${incoming.length} items imported on this device`)}catch(e){alert(e.message||'Could not read this export.')}};reader.readAsText(file)}
function exportData(){let blob=new Blob([JSON.stringify({...store,format:'groupops-wix-browser-v1',exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='groupops-workspace-export.json';a.click();URL.revokeObjectURL(a.href);toast('Workspace export downloaded')}
function toast(t){let a=document.getElementById('toastArea');a.innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>a.innerHTML='',2600)}
document.getElementById('filePicker').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});document.getElementById('importTop').onclick=()=>document.getElementById('filePicker').click();document.getElementById('exportTop').onclick=exportData;document.getElementById('globalSearch').oninput=e=>{query=e.target.value;if(current==='overview')go('tasks');else render()};document.getElementById('menuToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}});render();
</script>
</body></html>
